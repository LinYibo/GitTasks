#:schema node_modules/wrangler/config-schema.json
name = "gittasks-oauth-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The Worker serves https://gittasks.com/oauth/callback — the exact URL that
# must be registered as the OAuth App's callback (github.com/settings/developers).
# The gittasks.com zone has to be on Cloudflare for this route to work.
routes = [
  { pattern = "gittasks.com/oauth/callback", zone_name = "gittasks.com" },
]

[vars]
# From your OAuth App at github.com/settings/developers.
GITHUB_CLIENT_ID = "replace-me"

# Where the GitTasks app itself is served from.
APP_URL = "https://gittasks.com"

# GITHUB_CLIENT_SECRET is deliberately not a var — it is a secret:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
# Locally with `wrangler dev`, copy .dev.vars.example to .dev.vars instead.
